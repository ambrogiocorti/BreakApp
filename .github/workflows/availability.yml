name: BreakApp public availability
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/health-check.mjs'
      - 'tests/unit/health-check.test.mjs'
      - '.github/workflows/availability.yml'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check the real deployed Pages login, PWA manifest and service worker
        env:
          BREAKAPP_HEALTH_URL: https://ambrogiocorti.github.io/BreakApp/
        run: node scripts/health-check.mjs
