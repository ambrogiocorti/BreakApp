name: Collaudo ordine demo DEV
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/demo-real.mjs'
      - '.github/workflows/demo-real-qa.yml'
permissions:
  contents: read
jobs:
  demo:
    # Only the dedicated QA branch may trigger the external DEV test by PR.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/demo-order-20261104')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Crea e annulla un ordine fittizio nel solo DEV
        env:
          BREAKAPP_DEMO_E2E: 'yes'
        run: node tests/e2e/demo-real.mjs
