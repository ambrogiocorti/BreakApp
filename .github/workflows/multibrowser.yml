name: Multibrowser responsive smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build with Pages base
        env:
          GITHUB_PAGES_BASE: /BreakApp/
          VITE_SUPABASE_URL: https://ynvswdyirngvdpudcikl.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_3QzE7OSAtpx-AmXMRd9IkA_rRpe1qhI
        run: |
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          npm run verify
          node scripts/prepare-github-pages.mjs
      - name: Serve static output
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --base /BreakApp/ > /tmp/breakapp-preview.log 2>&1 &
          echo $! > /tmp/breakapp-preview.pid
      - name: Smoke test desktop and mobile on three browsers
        env:
          SMOKE_URL: http://127.0.0.1:4173/BreakApp/
        run: node tests/e2e/multibrowser.mjs
      - name: Test actual notification controls with an isolated API fixture on three browsers
        run: node tests/e2e/notifications.mjs
      - name: Test approval, promotion, class import and onboarding controls on three browsers
        run: node tests/e2e/workflows.mjs
      - name: Test shared and personal group support controls on three browsers
        run: node tests/e2e/support.mjs
      - name: Test guest creation, verified email binding and recovery controls on three browsers
        run: node tests/e2e/guest.mjs
      - name: Test workspace navigation, school directory and configuration on three browsers
        run: node tests/e2e/workspace.mjs
      - name: Stop preview
        if: always()
        run: kill "$(cat /tmp/breakapp-preview.pid)" || true
