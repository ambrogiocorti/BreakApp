name: BreakApp checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify source, tests and build
        run: npm run verify
      - name: Validate Storage backup shell syntax and encrypted artifact fixture
        run: |
          bash -n scripts/backup-storage-s3.sh scripts/create-encrypted-storage-archive.sh tests/scripts/storage-archive-smoke.sh tests/scripts/storage-s3-fixture.sh
          bash tests/scripts/storage-archive-smoke.sh
          bash tests/scripts/storage-s3-fixture.sh
