name: Cloudflare Pages emergency build package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Verify and build preconfigured BreakApp
        env:
          VITE_SUPABASE_URL: https://ynvswdyirngvdpudcikl.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_3QzE7OSAtpx-AmXMRd9IkA_rRpe1qhI
        run: npm run verify
      - name: Package deployment root
        run: |
          cd dist
          zip -q -r ../breakapp-pages.zip .
          cd ..
          unzip -l breakapp-pages.zip | tail -n 5
      - name: Publish ZIP artifact for Pages Direct Upload
        uses: actions/upload-artifact@v7
        with:
          name: breakapp-pages.zip
          path: breakapp-pages.zip
          archive: false
          retention-days: 3
