name: Deploy BreakApp to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript, run tests and compile
        env:
          GITHUB_PAGES_BASE: ${{ vars.GITHUB_PAGES_BASE || '/BreakApp/' }}
          VITE_SUPABASE_URL: https://ynvswdyirngvdpudcikl.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_3QzE7OSAtpx-AmXMRd9IkA_rRpe1qhI
        run: npm run verify
      - name: Prepare scoped PWA and 404 for project pages
        env:
          GITHUB_PAGES_BASE: ${{ vars.GITHUB_PAGES_BASE || '/BreakApp/' }}
        run: node scripts/prepare-github-pages.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
